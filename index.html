<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japan Trip PWA</title>
  <link rel="manifest" href="/Japan-Trip/manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <style>#map { height: 300px; }</style>
</head>
<body class="bg-white text-gray-800 font-sans">
  <main class="max-w-xl mx-auto p-4">
    <h1 class="text-3xl font-bold text-center mb-4">🇯🇵 Mein Japan Trip</h1>
    <p class="mb-6 text-center">Dein installierbarer Reiseplan mit Karte – funktioniert auch offline!</p>
    <div id="map" class="rounded border shadow"></div>
  </main>

  <script>
    const map = L.map('map').setView([35.6895, 139.6917], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    L.marker([35.6895, 139.6917]).addTo(map).bindPopup('Tokio').openPopup();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/Japan-Trip/service-worker.js')
          .then(reg => console.log('SW registered:', reg))
          .catch(err => console.log('SW error:', err));
      });
    }
  </script>
</body>
</html>
